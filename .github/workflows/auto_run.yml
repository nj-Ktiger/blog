name: Nomad Gear Daily Bot & Auto Publisher
on:
  schedule:
    # 매일 아침 한국시간 오전 7시 40분 (UTC 22:40)에 자동 실행
    - cron: '40 22 * * *'
  workflow_dispatch: # 깃허브에서 수동으로 '실행' 버튼 눌러 테스트도 가능

permissions:
  contents: write # 블로그 포스트(_posts) 및 이력(sent_history.txt) 자동 커밋/푸시 권한

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install -U pip && pip install -r requirements.txt

      - name: 봇 실행 및 블로그 글 생성 & 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 생성된 블로그 글 및 이력 자동 커밋 & 푸시 (GitHub Pages 자동 배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts sent_history.txt
          if ! git diff --staged --quiet; then
            git commit -m "feat: publish new blog post [skip ci]"
            git push
          fi
