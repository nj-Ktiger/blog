name: Nomad Gear Daily Bot & Auto Publisher
on:
  schedule:
    # 1) 매일 아침 한국시간 오전 8시 10분 (UTC 23:10)에 후보 3선 발송
    - cron: '10 23 * * *'
    # 2) 15분마다 사용자가 텔레그램에서 선택한 후보(1, 2, 3번 버튼/답장)가 있는지 확인 후 발행
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (propose: 새 후보 3개 발송 / check: 선택 응답 확인 후 발행)'
        required: false
        default: 'propose'
        type: choice
        options:
          - propose
          - check

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실행 모드 결정 및 대기 상태 사전 점검
        id: check_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode || 'propose' }}"
            echo "run_mode=$MODE" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "10 23 * * *" ]; then
            echo "run_mode=propose" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            # 15분 주기 체크: pending_candidates.json이 pending 상태일 때만 파이썬 실행
            if [ -f "pending_candidates.json" ] && grep -q '"status": "pending"' pending_candidates.json; then
              echo "run_mode=check" >> $GITHUB_OUTPUT
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "run_mode=skip" >> $GITHUB_OUTPUT
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 파이썬 설치
        if: steps.check_mode.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        if: steps.check_mode.outputs.should_run == 'true'
        run: pip install -U pip && pip install -r requirements.txt

      - name: 봇 실행 (후보 3선 발송 또는 선택된 글 발행)
        if: steps.check_mode.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git pull --rebase origin main || true
          python main.py --mode ${{ steps.check_mode.outputs.run_mode }} --wait 120

      - name: 변경사항 자동 커밋 & 푸시 (GitHub Pages 자동 배포)
        if: steps.check_mode.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts sent_history.txt pending_candidates.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "feat: update blog posts and candidate status [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
