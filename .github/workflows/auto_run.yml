name: Nomad Gear Daily Bot
on:
  schedule:
    # 매일 아침 한국시간 오전 8시 (UTC 23:00)에 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 깃허브에서 수동으로 '실행' 버튼 눌러 테스트도 가능
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      - name: 봇 실행 및 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
