# The Site Configuration
theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

title: "노마드 & 기어"
tagline: "디지털 노마드 & 테크 기어 큐레이션"
description: "한국 2030을 위한 디지털 노마드, 스마트 기어, 라이프스타일 테크 트렌드 큐레이션 블로그"

url: "https://nj-ktiger.github.io"
baseurl: "/blog"

github:
  username: nj-Ktiger

social:
  name: 노마드 & 기어
  email: shimnj@users.noreply.github.com
  links:
    - https://github.com/nj-Ktiger/blog

toc: true
theme_mode: dark # 기본 다크모드 (라이트/다크 전환 스위치 포함)

pwa:
  enabled: false

paginate: 8

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - README.md
  - LICENSE
  - sent_history.txt
  - pending_candidates.json
  - requirements.txt
  - main.py
  - __pycache__

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
